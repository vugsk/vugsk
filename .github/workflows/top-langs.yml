name: Update top languages card
on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-top-langs:
    name: Regenerate top-langs.svg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/top_langs.py top-langs.svg

      - name: Commit if changed
        run: |
          if git diff --quiet -- top-langs.svg; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-langs.svg
          git commit -m "chore: update top languages card"
          git push
